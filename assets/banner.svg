<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Tech Background Elements -->
  <!-- Floating Glowing Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#3b82f6" stroke-width="1"/>
    
    <line x1="200" y1="0" x2="200" y2="360" stroke="#3b82f6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke="#3b82f6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#3b82f6" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="360" stroke="#3b82f6" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#3b82f6" stroke-width="1"/>
  </g>

  <!-- Animated Floating Orbs in Background -->
  <circle cx="150" cy="90" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="90;120;90" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="270" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="270;240;270" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Dynamic Pulse Lines (Logistic Routes Concept) -->
  <path d="M 100 280 Q 300 320 500 280 T 900 290 T 1100 240" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Top & Bottom Border Highlights -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Foreground Content (Text strictly in foreground, clear and unblocked) -->
  <g text-anchor="middle">
    <!-- Icon / Tag -->
    <rect x="490" y="45" width="220" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="600" y="66" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      🌐 GLOBAL TRADE & LOGISTICS
    </text>

    <!-- Main Title -->
    <text x="600" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome Customs Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      A Curated Ecosystem of SaaS Platforms, AI Trade Compliance & Open-Source Projects 🛃
    </text>

    <!-- Dynamic Metric Badges in Foreground -->
    <g transform="translate(300, 245)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="22" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">100+ Countries</text>
      <text x="90" y="38" fill="#64748b" font-family="sans-serif" font-size="11">ASYCUDA Deployed</text>

      <!-- Badge 2 -->
      <rect x="210" y="0" width="180" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="300" y="22" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="700">Enterprise & OS</text>
      <text x="300" y="38" fill="#64748b" font-family="sans-serif" font-size="11">Customs Platforms</text>

      <!-- Badge 3 -->
      <rect x="420" y="0" width="180" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="510" y="22" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="700">AI Tariff Engines</text>
      <text x="510" y="38" fill="#64748b" font-family="sans-serif" font-size="11">Automated HTS & ABI</text>
    </g>
  </g>
</svg>
